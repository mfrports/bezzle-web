# Builds the site (Vite and React, every page prerendered) and puts it on bezzle.ch, on every push to
# main: a change to the site, and every release of the app, whose Scripts/release.sh pushes the new
# update feed (public/updates/appcast.xml) and its notes (src/releases/RELEASE_NOTES.md), and every
# release of Bezzle for Windows, whose Scripts/release-windows.sh pushes its own feed
# (public/updates/windows/appcast.xml). A release's files ride on a GitHub release of this repository
# (v<version>, windows-v<version>), and bezzle.ch serves them itself: the ones a feed names under
# https://bezzle.ch/downloads/ are fetched from there into the build.
#
# bezzle.ch is a webspace at One.com, reached by SFTP with the repository's secrets FTP_SERVER,
# FTP_USERNAME, FTP_PASSWORD and FTP_PATH (scripts/upload.sh sends only what changed). Once bezzle.ch
# serves the new build, GitHub Pages, where the site was until 7 November 2026, gets the same update
# feed, for the copies of Bezzle that read it there, and a redirect to bezzle.ch in place of every page
# (scripts/github-pages.mjs). Until bezzle.ch answers with this build, GitHub Pages is left as it is.
# The pages whose words changed are then announced to the search engines that take IndexNow.
#
# The site's own API goes up with it (api/: the visitor numbers it counts itself, and the admin area that reads
# them), its settings baked in from the repository's secrets (scripts/bake-config.mjs): DB_HOST, DB_NAME, DB_USER,
# DB_PASS for the webspace's database, ADMIN_PASSWORD (12 characters or more) to open bezzle.ch/admin, and
# OPENAI_API_KEY, optional, for the read of the numbers. A job of its own tests the API against PHP and MySQL; it
# never holds the deploy up, as counting never stands in the way of the site or the update feed.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: Send every file again, not only what changed
        type: boolean
        default: false

permissions:
  contents: read

# One deploy at a time, and none cut off half way.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  site:
    name: bezzle.ch
    runs-on: ubuntu-latest
    environment:
      name: bezzle.ch
      url: https://bezzle.ch/
    steps:
      # the whole history (without the old files' contents): when each page's words last changed,
      # for the sitemap and the pages' dates, is the last commit of the files they are written in
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: The downloads
        # what the feeds name under https://bezzle.ch/downloads/ (the Mac's zip and delta updates, Windows'
        # installers), from their GitHub releases, each the size its feed says (scripts/downloads.mjs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/downloads.mjs dist
      - name: The API
        # beside the pages, with what the read is told (the site's changes and the app's releases) and the settings
        # baked in; the secrets stay in this copy, which goes to bezzle.ch alone
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          for f in api/*.php; do php -l "$f" > /dev/null || exit 1; done
          cp -r api dist/api && rm -f dist/api/.env
          node scripts/api-facts.mjs dist/api
          node scripts/bake-config.mjs dist/api/config.php
          php -l dist/api/config.php > /dev/null
      - name: The sitemap bezzle.ch serves now
        # what the upload changes is told to the search engines afterwards (scripts/indexnow.mjs)
        run: curl -fsS "https://bezzle.ch/sitemap.xml?check=$(date +%s)" -o "$RUNNER_TEMP/sitemap-before.xml" || echo "No sitemap yet"
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp > /dev/null
      - name: Put it on bezzle.ch
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: scripts/upload.sh dist ${{ inputs.all && '--all' || '' }}
      - name: Check the live site
        run: |
          # The pages and the feed must be served as they were built, over HTTPS.
          live() {
            for try in $(seq 1 12); do
              curl -fsS "https://bezzle.ch/$1?check=$(date +%s)" 2>/dev/null | cmp -s - "dist/$1" && return 0
              sleep 10
            done
            echo "::error::https://bezzle.ch/$1 is not the one built: $(curl -sS -o /dev/null -w '%{http_code}' "https://bezzle.ch/$1" 2>&1)"
            return 1
          }
          live index.html
          live de/privacy.html
          if [ -f dist/updates/appcast.xml ]; then live updates/appcast.xml; else echo "No release yet"; fi
          if [ -f dist/updates/windows/appcast.xml ]; then live updates/windows/appcast.xml; else echo "No Bezzle for Windows yet"; fi
          # every download bezzle.ch serves itself, there and whole
          for f in dist/downloads/*; do
            [ -f "$f" ] || continue
            name="${f#dist/}" want=$(stat -c %s "$f")
            got=$(curl -fsSI "https://bezzle.ch/$name?check=$(date +%s)" | tr -d '\r' | awk 'tolower($1) == "content-length:" { print $2 }' | tail -1)
            [ "$got" = "$want" ] || { echo "::error::https://bezzle.ch/$name is ${got:-not there}, not $want bytes"; exit 1; }
          done
          echo "bezzle.ch serves this build"
      - name: Check the API
        # the counting and the admin area answer, their tables are in the database (made now if they are not), and
        # the helpers are kept from the web; never a reason for the deploy to fail
        continue-on-error: true
        run: |
          ping=$(curl -sS "https://bezzle.ch/api/admin.php?action=ping&check=$(date +%s)")
          echo "admin.php: $ping"
          case "$ping" in
            *'"stored":true'*) ;;
            *'"stored":false'*) echo "::warning::The API runs, but its database does not answer: check the DB_* secrets"; exit 1;;
            *) echo "::warning::bezzle.ch/api/admin.php did not answer as it should"; exit 1;;
          esac
          case "$ping" in *'"configured":false'*) echo "::warning::The admin area is shut: set the ADMIN_PASSWORD secret (12 characters or more) and deploy again";; esac
          for f in _views.php _changes.json _releases.json _windows.json; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "https://bezzle.ch/api/$f")
            [ "$code" = 403 ] || { echo "::warning::bezzle.ch/api/$f answered $code, not 403"; exit 1; }
          done
          echo "The API answers"
      - name: Tell the search engines what changed
        # IndexNow (Bing, Yandex and others): never a reason for the deploy to fail
        continue-on-error: true
        run: node scripts/indexnow.mjs "$RUNNER_TEMP/sitemap-before.xml"
      - name: What stays on GitHub Pages
        run: node scripts/github-pages.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages

  api:
    name: The API, against PHP and MySQL
    # hit.php, trail.php and admin.php as the browser and the admin area call them (tests/api.test.mjs)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: bezzle }
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Test the API
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: bezzle
          DB_USER: root
          DB_PASS: root
          ADMIN_PASSWORD: test-admin-password
        run: |
          for f in api/*.php; do php -l "$f" > /dev/null || exit 1; done
          php -S 127.0.0.1:8080 -t . > "$RUNNER_TEMP/php.log" 2>&1 &
          sleep 1
          node tests/api.test.mjs || { cat "$RUNNER_TEMP/php.log"; exit 1; }

  pages:
    name: GitHub Pages
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: public/updates
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Check the feed there
        run: |
          # The copies of Bezzle from before the move read the feed here: it must be the committed one.
          [ -f public/updates/appcast.xml ] || { echo "No release yet"; exit 0; }
          for try in 1 2 3 4 5 6; do
            if curl -fsS "${{ steps.deployment.outputs.page_url }}updates/appcast.xml?check=$(date +%s)" | cmp -s - public/updates/appcast.xml; then
              echo "The feed is live as committed"; exit 0
            fi
            sleep 10
          done
          echo "::error::The feed on GitHub Pages differs from public/updates/appcast.xml"; exit 1
