<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F0EDE7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1B1A18" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/img/favicon.png" type="image/png" sizes="64x64" />
    <link rel="icon" href="/img/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/img/icon-256.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="application-name" content="Bezzle" />
    <meta name="apple-mobile-web-app-title" content="Bezzle" />
    <!--seo:start--><title>Bezzle</title><!--seo:end-->
    <script>
      // With motion, the page's first view rises in (held as "loading" until its type is in, below).
      matchMedia("(prefers-reduced-motion: reduce)").matches || document.documentElement.classList.add("motion", "loading");
      // The visitor's computer, before anything paints, so a page offers what is for it (src/lib/os.js):
      // "win", "mac", or "other" for phones, tablets (an iPad says it is a Mac, with a touch screen) and the rest;
      // or the one picked on the download page in this visit.
      (function (h, n) {
        var p = (n.userAgentData && n.userAgentData.platform) || n.platform || "", a = n.userAgent || "", o = null;
        try { o = sessionStorage.getItem("bezzle-os"); } catch (e) {}
        h.setAttribute("data-os", o === "win" || o === "mac" ? o : /^win/i.test(p) || /Windows NT/.test(a) ? "win" : /^mac/i.test(p) && !(n.maxTouchPoints > 1) ? "mac" : "other");
      })(document.documentElement, navigator);
    </script>
  </head>
  <body>
    <div id="root"><!--app:html--></div>
    <script>
      /* The first view, without waiting for the app: the page paints as soon as it is here, and with
         motion its first view rises in once the headline's type is in (or after a moment without it),
         what is on the screen one after another; the rest rises as it is scrolled to, once the app
         has come (src/lib/reveal.js). Should the app never come, everything simply stands there. */
      (function (h) {
        if (!h.classList.contains("loading")) return;
        var first = [], q = document.querySelectorAll("[data-reveal]"), H = innerHeight, i, r;
        h.classList.add("reveals");
        for (i = 0; i < q.length; i++) { r = q[i].getBoundingClientRect(); if (r.top < H * 0.94 && r.bottom > 0) first.push(q[i]); }
        var go = function () {
          if (!h.classList.contains("loading")) return;
          first.forEach(function (el, n) {
            el.style.setProperty("--d", Math.min(n, 7) * 75 + "ms");
            el.setAttribute("data-first", "");
            el.setAttribute("data-in", "");
            el.addEventListener("animationend", function done(e) {
              if (e.target !== el || e.animationName !== "bz-rise") return;
              el.removeEventListener("animationend", done);
              el.setAttribute("data-done", "");
            });
          });
          h.classList.remove("loading");
          dispatchEvent(new Event("bz:revealed"));
        };
        setTimeout(go, 900);
        if (document.fonts && document.fonts.load) document.fonts.load('600 1em "Newsreader Variable"').then(go, go); else go();
        setTimeout(function () { if (!window.bzReveals) h.classList.remove("reveals"); }, 8000);
      })(document.documentElement);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
